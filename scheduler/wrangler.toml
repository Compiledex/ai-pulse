# Deploy: npx wrangler deploy --config scheduler/wrangler.toml
# Secret: npx wrangler secret put GITHUB_TOKEN --config scheduler/wrangler.toml
name = "ai-pulse-scheduler"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

# Must match the cron in .github/workflows/build.yml — the page's countdown reads that one.
[triggers]
crons = ["17,47 * * * *"]
